apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-html
  namespace: jenkins-demo
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
        <title>Jenkins OpenShift Demo</title>
    </head>
    <body>
        <h1>Hello from Jenkins!</h1>
        <h2>Application deployed successfully to OpenShift</h2>
        <p>GitHub → Jenkins → OpenShift</p>
    </body>
    </html>

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: jenkins-demo
data:
  nginx.conf: |
    worker_processes auto;
    pid /tmp/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        access_log /tmp/access.log;
        error_log /tmp/error.log;

        client_body_temp_path /tmp/client_temp;
        proxy_temp_path /tmp/proxy_temp;
        fastcgi_temp_path /tmp/fastcgi_temp;
        uwsgi_temp_path /tmp/uwsgi_temp;
        scgi_temp_path /tmp/scgi_temp;

        sendfile on;
        keepalive_timeout 65;

        server {
            listen 8080;

            server_name _;

            root /usr/share/nginx/html;

            location / {
                try_files $uri $uri/ =404;
            }
        }
    }

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-demo
  namespace: jenkins-demo
spec:
  replicas: 2

  selector:
    matchLabels:
      app: nginx-demo

  template:
    metadata:
      labels:
        app: nginx-demo

    spec:
      containers:
        - name: nginx
          image: nginx:latest

          ports:
            - containerPort: 8080

          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html

            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf

      volumes:
        - name: html
          configMap:
            name: nginx-html

        - name: nginx-config
          configMap:
            name: nginx-config

---

apiVersion: v1
kind: Service
metadata:
  name: nginx-demo
  namespace: jenkins-demo
spec:
  selector:
    app: nginx-demo

  ports:
    - port: 80
      targetPort: 8080

---

apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: nginx-demo
  namespace: jenkins-demo
spec:
  to:
    kind: Service
    name: nginx-demo

  port:
    targetPort: 80
