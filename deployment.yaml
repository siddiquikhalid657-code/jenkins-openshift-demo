
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-demo
  namespace: jenkins-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-demo
  template:
    metadata:
      labels:
        app: nginx-demo
    spec:
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:stable-alpine
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: web-content
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
      volumes:
        - name: web-content
          configMap:
            name: nginx-demo-html
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-demo
  namespace: jenkins-demo
spec:
  selector:
    app: nginx-demo
  ports:
    - port: 8080
      targetPort: 8080
